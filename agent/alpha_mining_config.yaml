# Alpha Mining System — Configuration
# Edit this file to tune the mining run. All CLI flags override these values.

mining:
  n_generations: 5          # number of evolution rounds
  factors_per_generation: 8 # new factors generated each round (LLM + mutations)
  top_k_survivors: 3        # best factors kept as seeds for the next generation
  min_grade: "B"            # minimum grade (A/B/C/D/F) for a factor to survive
  min_rank_ic: 0.015        # hard floor: factors below this are always dropped
  diversity_penalty: true   # penalise factors too similar to existing survivors
  diversity_corr_threshold: 0.90

generation:
  mode: "dsl"               # dsl (safe JSON expression) or python (legacy full module)
  allowed_fields: [open, high, low, close, volume, amount, vwap, market_cap, industry]
  max_expression_depth: 8
  max_expression_nodes: 80
  max_lookback_window: 252
  use_prepared_recipes: true  # LLM chooses from prepared DSL formula recipes instead of inventing common formulas
  seed_prompts:             # Round-0 starting prompts (overridden by survivors in later rounds)
    - "20-day price momentum: past 20-day return, cross-sectionally ranked"
    - "short-term reversal: negative 5-day return, winsorized 1-99%"
    - "volume-price divergence: 10-day close change divided by 10-day average volume change"
    - "volatility: 20-day rolling std of daily returns, ranked cross-sectionally"
  extra_factor_types:       # injected into the LLM prompt to encourage diversity
    - momentum
    - reversal
    - volatility
    - volume
    - value_proxy
    - earnings_quality

mutation:
  enabled: true
  window_sweeps: [5, 10, 20, 40, 60, 120]   # replace detected windows with these
  transforms:                       # transforms to try on top factors
    - winsorize
    - rank
    - zscore
    - ts_rank
  max_variants_per_factor: 4        # cap mutations per surviving factor
  llm_refine: true                  # also ask LLM to intelligently improve survivors

evaluation:
  data_pkl: "data.pkl"
  outer_workers: 1        # level-1: how many factors to evaluate in parallel (1 = sequential)
  workers: 2              # level-2: parallel IC workers per factor evaluation
  next_day_return: true
  exclude_st: true
  exclude_limit_up: true
  exclude_limit_down: true
  exclude_suspended: true
  timeout_sec: 180        # kill a factor evaluation after this many seconds
  pipeline_queue_enabled: true  # overlap LLM generation and factor evaluation inside each generation
  pipeline_queue_size: 0        # 0 = auto (2 * outer_workers, min 2)
  ic_similarity_threshold: 0.90
  diversity_min_overlap: 10000
  diversity_sample_size: 300000
  transaction_cost_bps: 25.0
  max_complexity_score: 60
  compute_trade_metrics: false  # true reads data.pkl again per factor to estimate LS/cost/DD metrics
  train_start: ""
  train_end: ""
  validation_start: ""
  validation_end: ""
  test_start: ""
  test_end: ""
  recent_start: ""
  recent_end: ""

llm:
  model: "gpt-4.1"                # for anthropic: e.g. claude-sonnet-4-6 or claude-opus-4-7
  provider: "openai"              # "openai" (needs OPENAI_API_KEY) or "anthropic" (needs ANTHROPIC_API_KEY)
  temperature: 0.4                # slightly higher for more creative factor generation
  max_retries: 3
  retry_backoff_sec: 2            # doubles each retry

harness:
  checkpoint_every: 1     # save checkpoint after every N generations
  ledger_file: "agent_runs/mining/factor_ledger.csv"   # all-time evaluated factor log
  dedup_on_code_hash: true   # skip re-evaluating factor code seen before
  notify_telegram: true      # send Telegram update after each generation (needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID env vars)
  max_run_hours: 4           # safety limit: stop after this many hours
